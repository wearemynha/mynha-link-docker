name: ${COMPOSE_PROJECT_NAME:-mynha-link}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkstack}
      POSTGRES_USER: ${POSTGRES_USER:-linkstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  linkstack:
    image: ${LINKSTACK_IMAGE:-ghcr.io/wearemynha/mynha-link:local}
    build:
      context: .
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.23.5}
        NODE_VERSION: ${NODE_VERSION:-24-alpine}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-linkstack}
      DB_USERNAME: ${POSTGRES_USER:-linkstack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Mynha Link}
      TZ: ${TZ:-America/Sao_Paulo}
      SERVER_ADMIN: ${SERVER_ADMIN:-admin@example.com}
      HTTP_SERVER_NAME: ${HTTP_SERVER_NAME:-localhost}
      HTTPS_SERVER_NAME: ${HTTPS_SERVER_NAME:-localhost}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      UPLOAD_MAX_FILESIZE: ${UPLOAD_MAX_FILESIZE:-8M}
      POST_MAX_SIZE: ${POST_MAX_SIZE:-16M}
    volumes:
      - linkstack_data:/htdocs
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    stop_grace_period: 30s

volumes:
  linkstack_data:
  postgres_data:
